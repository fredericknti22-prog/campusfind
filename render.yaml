# CampusFind on Render — Express backend + static UI.
# Database: Render Postgres (or set SUPABASE_DB_URL to a Supabase URI).
# Auth/Storage: Firebase.
databases:
  - name: campusfind-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: campusfind
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PHOTO_STORE
        value: db
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: campusfind-db
          property: connectionString
      - key: SUPABASE_DB_URL
        fromDatabase:
          name: campusfind-db
          property: connectionString
      # Set these in the Render Dashboard — do not commit secrets:
      # FIREBASE_PROJECT_ID, WEB_API_KEY / FIREBASE_WEB_API_KEY,
      # FIREBASE_STORAGE_BUCKET, FIREBASE_SERVICE_ACCOUNT, BASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD
